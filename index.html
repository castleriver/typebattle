    @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
    .anim-pop { animation: pop .35s ease-out; }

    .anim-shake { animation: shake .4s; }

    @keyframes floatUp { 0% { transform: translate(-50%, 0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -80px) scale(1.3); opacity: 0; } }

               text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: floatUp .9s ease-out forwards; }

      delay: Math.random() * 1.5,
      dur: 2.5 + Math.random() * 2,
      color: ["#f87171", "#fbbf24", "#34d399", "#60a5fa", "#a78bfa", "#f472b6"][i % 6]

    // ----------------------------------------------------
    // 효과음 (파일 없이 브라우저에서 직접 합성)
    // ----------------------------------------------------
    const Sound = (() => {
      let ctx = null;
      let muted = false;
      try { muted = localStorage.getItem("taja-muted") === "1"; } catch (e) {}

      const getCtx = () => {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
        }
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      };

      const tone = (c, freq, at, dur, opt = {}) => {
        const { type = "sine", vol = 0.15, to = null } = opt;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, at);
        if (to) osc.frequency.exponentialRampToValueAtTime(to, at + dur);
        g.gain.setValueAtTime(0.0001, at);
        g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(g);
        g.connect(c.destination);
        osc.start(at);
        osc.stop(at + dur + 0.02);
      };

      const noise = (c, at, dur, vol) => {
        const len = Math.floor(c.sampleRate * dur);
        const buf = c.createBuffer(1, len, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = c.createBufferSource();
        src.buffer = buf;
        const f = c.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.value = 900;
        const g = c.createGain();
        g.gain.value = vol;
        src.connect(f);
        f.connect(g);
        g.connect(c.destination);
        src.start(at);
      };

        correct: (c, t) => { tone(c, 988, t, 0.08, { type: "square", vol: 0.06 }); tone(c, 1319, t + 0.07, 0.12, { type: "square", vol: 0.06 }); },

        wrong: (c, t) => tone(c, 220, t, 0.25, { type: "sawtooth", vol: 0.08, to: 110 }),
        item: (c, t) => [784, 988, 1175, 1568].forEach((f, i) => tone(c, f, t + i * 0.08, 0.2, { type: "triangle", vol: 0.15 })),
        boost: (c, t) => tone(c, 300, t, 0.4, { type: "sawtooth", vol: 0.07, to: 1500 }),
        attack: (c, t) => { noise(c, t, 0.3, 0.25); tone(c, 400, t, 0.3, { type: "square", vol: 0.05, to: 120 }); },
        splat: (c, t) => { noise(c, t, 0.45, 0.35); tone(c, 180, t, 0.4, { vol: 0.2, to: 60 }); },
        count: (c, t) => tone(c, 660, t, 0.15, { type: "square", vol: 0.08 }),
        go: (c, t) => tone(c, 1320, t, 0.4, { type: "square", vol: 0.08 }),
        tick: (c, t) => tone(c, 1000, t, 0.05, { type: "square", vol: 0.05 }),
        join: (c, t) => { tone(c, 880, t, 0.1, { vol: 0.12 }); tone(c, 1175, t + 0.08, 0.15, { vol: 0.12 }); },
        end: (c, t) => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(c, f, t + i * 0.12, i === 5 ? 0.6 : 0.14, { type: "triangle", vol: 0.15 })),
        kicked: (c, t) => [440, 349, 262].forEach((f, i) => tone(c, f, t + i * 0.15, 0.2, { type: "sawtooth", vol: 0.07 }))
      };

      return {
        unlock: getCtx, // 버튼 클릭 때 호출해야 소리가 나기 시작함
        play: (name) => {
          if (muted || !SOUNDS[name]) return;
          const c = getCtx();
          if (!c) return;
          try { SOUNDS[name](c, c.currentTime + 0.01); } catch (e) {}
        },
        isMuted: () => muted,
        setMuted: (m) => {
          muted = m;
          try { localStorage.setItem("taja-muted", m ? "1" : "0"); } catch (e) {}

    function App() {
      const [view, setView] = useState("LOBBY"); // LOBBY, ROOM, GAME, RESULT, KICKED
      const [playerName, setPlayerName] = useState("");
      const [inputCode, setInputCode] = useState(""); // 로비에서 입력 중인 코드

      const [mode, setMode] = useState("WORD");       // WORD or SENTENCE
      const [duration, setDuration] = useState(120);
      const [isHost, setIsHost] = useState(false);
      const [busy, setBusy] = useState(false);
      const [myId, setMyId] = useState("");
      const [muted, setMuted] = useState(Sound.isMuted());

      const [players, setPlayers] = useState([]);
      const [targetText, setTargetText] = useState("");
      const [input, setInput] = useState("");
      const [combo, setCombo] = useState(0);
      const [items, setItems] = useState([]);
      const [isBlind, setIsBlind] = useState(false);
      const [blindKey, setBlindKey] = useState(0);
      const [isWrong, setIsWrong] = useState(false);
      const [effectMsg, setEffectMsg] = useState("");
      const [effectKey, setEffectKey] = useState(0);
      const [timeLeft, setTimeLeft] = useState(0);
      const [countdown, setCountdown] = useState(0);
      const [showGo, setShowGo] = useState(false);
      const [floaters, setFloaters] = useState([]);

      // 연결 콜백은 한 번만 등록되므로, 그 안에서 쓰는 값은 모두 ref로 관리한다
      const roomRef = useRef({ status: null, mode: "WORD", duration: 120, players: [] }); // 방장이 가진 원본
      const peerRef = useRef(null);
      const connRef = useRef(null);   // 참가자 → 방장 연결
      const connsRef = useRef({});    // 방장 → 참가자 연결들
      const bannedRef = useRef(new Set()); // 강퇴된 이름
      const isHostRef = useRef(false);
      const modeRef = useRef("WORD");
      const durationRef = useRef(120);
      const statusRef = useRef(null);
      const targetRef = useRef("");
      const comboRef = useRef(0);
      const composingRef = useRef(false);
      const enterPendingRef = useRef(false);
      const startAtRef = useRef(0);
      const endAtRef = useRef(0);
      const lastCountRef = useRef(null);
      const lastTickRef = useRef(null);
      const blindTimerRef = useRef(null);
      const effectTimerRef = useRef(null);
      const prevCountRef = useRef(0);
      const inputEl = useRef(null);

      // 점수는 항상 방장이 보내준 값을 기준으로 한다
      const me = players.find(p => p.id === myId);
      const score = me ? me.score : 0;
      const sortedPlayers = [...players].sort((a, b) => b.score - a.score);

      const showEffect = (txt) => {
        clearTimeout(effectTimerRef.current);
        setEffectMsg(txt);
        setEffectKey(k => k + 1);
        effectTimerRef.current = setTimeout(() => setEffectMsg(""), 2000);
      };

      const getBlinded = () => {
        clearTimeout(blindTimerRef.current);
        setBlindKey(k => k + 1);
        setIsBlind(true);
        Sound.play("splat");
        blindTimerRef.current = setTimeout(() => setIsBlind(false), 3000);
      };

      // 다음 문제 출제 (직전 문제 제외)
      const nextQuestion = () => {
        const pool = modeRef.current === "WORD" ? WORDS : SENTENCES;
        let next = targetRef.current;
        while (next === targetRef.current) {
          next = pool[Math.floor(Math.random() * pool.length)];
        }
        targetRef.current = next;
        setTargetText(next);
        setInput("");
      };

      // 방 상태를 화면에 반영 (방장·참가자 공통)
      const applyRoom = (r) => {
        setPlayers(r.players);
        modeRef.current = r.mode;
        durationRef.current = r.duration;
        setMode(r.mode);
        setDuration(r.duration);

        if (r.status === statusRef.current) return;
        statusRef.current = r.status;

        comboRef.current = 0;
        setCombo(0);
        setItems([]);
        setFloaters([]);

        if (r.status === "WAITING") {
          clearTimeout(blindTimerRef.current);
          setIsBlind(false);
          setView("ROOM");
        } else if (r.status === "PLAYING") {
          startAtRef.current = Date.now() + COUNTDOWN * 1000;
          endAtRef.current = startAtRef.current + r.duration * 1000;
          lastCountRef.current = null;
          lastTickRef.current = null;
          setCountdown(COUNTDOWN);
          setTimeLeft(r.duration);
          nextQuestion();
          setView("GAME");
        } else if (r.status === "FINISHED") {
          setView("RESULT");
        }
      };

      // 강퇴당했을 때 (참가자)
      const beKicked = () => {
        const peer = peerRef.current;
        peerRef.current = null; // 연결 끊김 알림이 뜨지 않게 먼저 비움
        if (peer) setTimeout(() => peer.destroy(), 200);
        Sound.play("kicked");
        setView("KICKED");
      };

      // 참가자(그리고 방장 자신)가 받는 메시지 처리
      const clientHandle = (msg) => {
        if (msg.type === "state") applyRoom(msg.room);
        else if (msg.type === "blind") getBlinded();
        else if (msg.type === "msg") {
          showEffect(msg.text);
          if (msg.sound) Sound.play(msg.sound);
        } else if (msg.type === "kicked") beKicked();
      };

      // ---------------- 방장 전용 로직 ----------------
      const sendTo = (id, msg) => {
        if (id === "host") return clientHandle(msg);
        const c = connsRef.current[id];
        if (c && c.open) c.send(msg);
      };

      // 방 상태를 바꾸고 모두에게 알림
      const commit = (r) => {
        roomRef.current = r;
        applyRoom(r);
        Object.values(connsRef.current).forEach(c => { if (c.open) c.send({ type: "state", room: r }); });
      };

      const hostHandle = (id, msg, conn) => {
        const r = roomRef.current;
        const commitPlayers = (list) => commit({ ...r, players: list });

        if (msg.type === "join") {
          const name = String(msg.name || "").trim().slice(0, 10);
          if (bannedRef.current.has(name)) return conn.send({ type: "error", text: "선생님이 이 이름의 입장을 막았어요." });
          if (r.status !== "WAITING") return conn.send({ type: "error", text: "이미 게임이 진행 중인 방입니다!" });
          if (!name || r.players.some(p => p.name === name)) {
            return conn.send({ type: "error", text: "이미 사용 중인 이름입니다. 다른 이름을 입력하세요!" });
          }
          connsRef.current[id] = conn;
          return commitPlayers([...r.players, { id, name, score: 0, combo: 0, joined: Date.now() }]);
        }

        const player = r.players.find(p => p.id === id);
        if (!player || r.status !== "PLAYING") return; // 강퇴된 학생의 메시지도 여기서 무시됨
        const change = (targetId, fn) => (p) => (p.id === targetId ? { ...p, ...fn(p) } : p);

        if (msg.type === "correct") {
          const added = r.mode === "WORD" ? 10 : 30;
          commitPlayers(r.players.map(change(id, p => ({ score: p.score + added, combo: Number(msg.combo) || 0 }))));
        } else if (msg.type === "wrong") {
          commitPlayers(r.players.map(change(id, () => ({ combo: 0 }))));
        } else if (msg.type === "item") {
          if (msg.item === "BOOST_20") {
            const bonus = Math.max(20, Math.floor(player.score * 0.2));
            commitPlayers(r.players.map(change(id, p => ({ score: p.score + bonus }))));
            sendTo(id, { type: "msg", text: `🚀 점수 +${bonus}점!`, sound: "boost" });
          } else if (msg.item === "BLIND_ALL") {
            r.players.forEach(p => { if (p.id !== id) sendTo(p.id, { type: "blind" }); });
            sendTo(id, { type: "msg", text: "🕶️ 상대방 전원 먹칠 공격!", sound: "attack" });
          }
        }
      };

      // 학생 내보내기 (방장)
      const kickPlayer = (p) => {
        if (!isHostRef.current || p.id === "host") return;
        if (!confirm(`${p.name} 학생을 내보낼까요?\n같은 이름으로는 이 방에 다시 들어올 수 없습니다.`)) return;
        bannedRef.current.add(p.name);
        const c = connsRef.current[p.id];
        delete connsRef.current[p.id];
        if (c && c.open) {
          c.send({ type: "kicked" });
          setTimeout(() => c.close(), 500);
        }
        const r = roomRef.current;
        commit({ ...r, players: r.players.filter(x => x.id !== p.id) });
        showEffect(`${p.name} 학생을 내보냈습니다.`);
      };

      // 내 행동 보내기: 방장은 바로 처리, 참가자는 방장에게 전송
      const act = (msg) => {
        if (isHostRef.current) hostHandle("host", msg);
        else if (connRef.current && connRef.current.open) connRef.current.send(msg);
      };

      // 방 만들기 (4자리 코드, 중복 시 재시도)
      const createRoom = () => {
        Sound.unlock();
        const name = playerName.trim();
        if (!name) return alert("이름을 입력해주세요!");
        setBusy(true);

        const tryOpen = (attempt) => {
          const code = Math.floor(1000 + Math.random() * 9000).toString();
          const peer = new Peer(PEER_PREFIX + code);

          peer.on("open", () => {
            peerRef.current = peer;
            isHostRef.current = true;
            setIsHost(true);
            setMyId("host");
            setRoomCode(code);
            setBusy(false);
            commit({
              status: "WAITING", mode, duration,
              players: [{ id: "host", name, score: 0, combo: 0, joined: Date.now() }]
            });
          });

          peer.on("connection", (conn) => {
            conn.on("data", (m) => hostHandle(conn.peer, m, conn));
            conn.on("close", () => {
              if (connsRef.current[conn.peer] !== conn) return; // 강퇴 등으로 이미 정리된 연결
              delete connsRef.current[conn.peer];
              const r = roomRef.current;
              // 대기 중에 나간 학생만 목록에서 제거 (게임 중에는 점수 유지)
              if (r.status === "WAITING") commit({ ...r, players: r.players.filter(p => p.id !== conn.peer) });
            });
          });

          peer.on("disconnected", () => { if (!peer.destroyed) peer.reconnect(); });

          peer.on("error", (err) => {
            if (err.type === "unavailable-id" && attempt < 5) {
              peer.destroy();
              tryOpen(attempt + 1);
            } else if (!peerRef.current) {
              peer.destroy();
              setBusy(false);
              alert("방 만들기 실패: 인터넷 연결을 확인하세요. (" + err.type + ")");
            }
          });
        };
        tryOpen(0);
      };

      // 방 참가
      const joinRoom = () => {
        Sound.unlock();
        const name = playerName.trim();
        const code = inputCode.trim();
        if (!name || !code) return alert("이름과 방코드를 입력하세요!");
        setBusy(true);

        const peer = new Peer();
        let done = false;
        const fail = (text) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          peer.destroy();
          setBusy(false);
          alert(text);
        };
        const timer = setTimeout(
          () => fail("연결 시간이 초과되었습니다. 방 코드를 확인하거나, 네트워크가 기기 간 직접 연결을 막고 있는지 확인하세요."),
          12000
        );

        peer.on("open", (id) => {
          const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: "json" });
          conn.on("open", () => {
            connRef.current = conn;
            setMyId(id);
            conn.send({ type: "join", name });
          });
          conn.on("data", (m) => {
            if (m.type === "error") return fail(m.text);
            if (!done) {
              done = true;
              clearTimeout(timer);
              peerRef.current = peer;
              isHostRef.current = false;
              setIsHost(false);
              setRoomCode(code);
              setBusy(false);
            }
            clientHandle(m);
          });
          conn.on("close", () => {
            if (peerRef.current === peer) {
              alert("방장과의 연결이 끊어졌습니다. 처음 화면으로 돌아갑니다.");
              location.reload();
            }
          });
        });

        peer.on("error", (err) => {
          fail(err.type === "peer-unavailable" ? "존재하지 않는 방입니다!" : "연결 실패: 인터넷 연결을 확인하세요. (" + err.type + ")");
        });
      };

      // 게임 타이머 (카운트다운 → 본 게임)
      useEffect(() => {
        if (view !== "GAME") return;
        const timer = setInterval(() => {
          const now = Date.now();
          const cd = Math.max(0, Math.ceil((startAtRef.current - now) / 1000));
          setCountdown(cd);
          if (cd !== lastCountRef.current) {
            if (lastCountRef.current !== null || cd > 0) Sound.play(cd > 0 ? "count" : "go");
            lastCountRef.current = cd;
          }
          setShowGo(now >= startAtRef.current && now - startAtRef.current < 700);

          const left = Math.max(0, Math.ceil((endAtRef.current - now) / 1000));
          setTimeLeft(Math.min(left, durationRef.current));
          if (cd === 0 && left > 0 && left <= 5 && left !== lastTickRef.current) {
            lastTickRef.current = left;
            Sound.play("tick");
          }
          if (left <= 0) {
            clearInterval(timer);
            if (isHostRef.current) commit({ ...roomRef.current, status: "FINISHED" });
            else setView("RESULT");
          }
        }, 100);
        return () => clearInterval(timer);
      }, [view]);

      // 문제가 바뀌거나 카운트다운이 끝나면 입력창에 포커스
      useEffect(() => {
        if (view === "GAME" && countdown === 0 && inputEl.current) inputEl.current.focus();
      }, [view, targetText, countdown]);

      // 대기실에 학생이 들어오면 알림음
      useEffect(() => {
        if (view === "ROOM" && prevCountRef.current > 0 && players.length > prevCountRef.current) Sound.play("join");
        prevCountRef.current = players.length;
      }, [players.length, view]);

      // 게임 종료 효과음
      useEffect(() => {
        if (view === "RESULT") Sound.play("end");
      }, [view]);

      // 정답 처리
      const handleCorrect = () => {
        const added = modeRef.current === "WORD" ? 10 : 30;
        const newCombo = comboRef.current + 1;
        comboRef.current = newCombo;
        setCombo(newCombo);
        Sound.play(newCombo % 5 === 0 ? "combo" : "correct");

        const fid = Date.now() + Math.random();
        setFloaters(f => [...f, { id: fid, text: `+${added}` }]);
        setTimeout(() => setFloaters(f => f.filter(x => x.id !== fid)), 900);

        // 10콤보 달성 때마다 30% 확률로 아이템 획득 (이미 보유 중이면 획득하지 않음)
        if (items.length === 0 && newCombo % ITEM_COMBO === 0 && Math.random() < ITEM_CHANCE) {
          setItems([pickItem()]);
          showEffect("🎁 아이템 획득!");
          Sound.play("item");
        }

        act({ type: "correct", combo: newCombo });
        nextQuestion();
      };

      // 오답 처리 (Enter로 틀린 답을 제출했을 때)
      const handleWrong = () => {
        comboRef.current = 0;
        setCombo(0);
        setIsWrong(true);
        setTimeout(() => setIsWrong(false), 400);
        Sound.play("wrong");
        act({ type: "wrong" });
      };

      const isMatch = (val) => targetRef.current && val.trim() === targetRef.current;

      // 타자 입력 처리 (한글 조합 중에는 정답 판정을 미룬다)
      const handleInputChange = (e) => {
        const val = e.target.value.replace(/^\s+/, "");
        setInput(val);
        if (composingRef.current || e.nativeEvent.isComposing) return;
        if (isMatch(val)) handleCorrect();
      };

      const handleCompositionStart = () => { composingRef.current = true; };

      const handleCompositionEnd = (e) => {
        composingRef.current = false;
        const val = e.target.value;
        const wasEnter = enterPendingRef.current;
        enterPendingRef.current = false;
        if (isMatch(val)) handleCorrect();
        else if (wasEnter && val.trim()) handleWrong();
      };

      const handleKeyDown = (e) => {
        if (e.key !== "Enter") return;
        if (composingRef.current || e.nativeEvent.isComposing || e.keyCode === 229) {
          enterPendingRef.current = true; // 조합이 끝나는 시점에 판정
          return;
        }
        const val = e.target.value;
        if (!val.trim()) return;
        if (isMatch(val)) handleCorrect();
        else handleWrong();
      };

      // 아이템 사용
      const useItem = (itemType, index) => {
        setItems(prev => prev.filter((_, i) => i !== index));
        act({ type: "item", item: itemType });
      };

      const startGame = () => {
        commit({ ...roomRef.current, status: "PLAYING" });
      };

      // 방장: 같은 방에서 다시 하기
      const restartGame = () => {
        const r = roomRef.current;
        commit({ ...r, status: "WAITING", players: r.players.map(p => ({ ...p, score: 0, combo: 0 })) });
      };

      const toggleMute = () => {
        Sound.setMuted(!muted);
        setMuted(!muted);
        if (muted) { Sound.unlock(); Sound.play("correct"); }
      };

      // ---------------- UI 렌더링 ----------------
      const page = (children) => (
        <>
          <button
            onClick={toggleMute}
            title={muted ? "소리 켜기" : "소리 끄기"}
            className="fixed top-3 right-3 z-50 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-full w-11 h-11 text-xl"
          >
            {muted ? "🔇" : "🔊"}
          </button>
          {children}
        </>
      );

      const effectBanner = effectMsg && (
        <div key={effectKey} className="bg-indigo-600 text-white font-bold p-3 rounded-lg text-center mb-4 anim-slide">
          {effectMsg}
        </div>
      );

      if (view === "KICKED") {
        return page(
          <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center">
            <div className="text-7xl anim-floaty mb-4">👋</div>
            <h2 className="text-2xl font-bold mb-2">방에서 나가게 되었어요</h2>
            <p className="text-slate-400 mb-6">선생님이 방에서 내보냈습니다.</p>
            <button onClick={() => location.reload()} className="bg-slate-600 hover:bg-slate-500 font-bold px-6 py-3 rounded-lg">
              처음으로
            </button>
          </div>
        );
      }

      if (view === "LOBBY") {
        return page(
          <div className="flex flex-col items-center justify-center min-h-screen p-4">
            <h1 className="text-4xl font-bold text-indigo-400 mb-8 text-center">
              <span className="anim-floaty">⚡</span> 실시간 타자 대결 <span className="anim-floaty" style={{ animationDelay: ".5s" }}>⚡</span>
            </h1>
            <div className="bg-slate-800 p-6 rounded-xl w-full max-w-md shadow-lg space-y-4 anim-rise">
              <input
                type="text"
                placeholder="이름 (닉네임)"
                maxLength={10}
                className="w-full p-3 rounded bg-slate-700 text-white outline-none border border-slate-600 focus:border-indigo-500"
                value={playerName}
                onChange={e => setPlayerName(e.target.value)}
              />
              <div className="flex space-x-2">
                <select
                  className="p-3 rounded bg-slate-700 text-white border border-slate-600"
                  value={mode}
                  onChange={e => setMode(e.target.value)}
                >
                  <option value="WORD">단어 연습</option>
                  <option value="SENTENCE">문장 연습</option>
                </select>
                <select
                  className="p-3 rounded bg-slate-700 text-white border border-slate-600"
                  value={duration}
                  onChange={e => setDuration(Number(e.target.value))}
                >
                  {GAME_SECONDS.map(s => <option key={s} value={s}>{s / 60}분</option>)}
                </select>
                <button onClick={createRoom} disabled={busy} className="flex-1 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 font-bold p-3 rounded transition active:scale-95">
                  방 만들기
                </button>
              </div>
              <div className="border-t border-slate-700 my-4"></div>
              <div className="flex space-x-2">
                <input
                  type="text"
                  inputMode="numeric"
                  maxLength={4}
                  placeholder="방 코드 4자리"
                  className="flex-1 p-3 rounded bg-slate-700 text-white outline-none border border-slate-600"
                  value={inputCode}
                  onChange={e => setInputCode(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter" && !busy) joinRoom(); }}
                />
                <button onClick={joinRoom} disabled={busy} className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 font-bold p-3 rounded transition active:scale-95">
                  입장하기
                </button>
              </div>
              {busy && <p className="text-center text-slate-400 animate-pulse">연결 중...</p>}
            </div>
          </div>
        );
      }

      if (view === "ROOM") {
        return page(
          <div className="flex flex-col items-center justify-center min-h-screen p-4">
            <div className="bg-slate-800 p-6 rounded-xl w-full max-w-lg text-center shadow-lg">
              {effectBanner}
              <h2 className="text-2xl font-bold text-slate-300">
                대기실 (모드: {mode === "WORD" ? "단어" : "문장"} · {duration / 60}분)
              </h2>
              <div className="text-5xl font-extrabold text-indigo-400 my-4 tracking-widest">{roomCode}</div>
              <p className="text-slate-400 mb-6">
                {isHost ? "학생들에게 방 코드를 공유해 주세요! 이 탭을 닫으면 방이 사라집니다." : "방에 입장했습니다."}
              </p>

              <h3 className="text-lg font-bold mb-2 text-left">참가자 목록 ({players.length}명)</h3>
              <div className="bg-slate-700 rounded p-4 mb-6 max-h-72 overflow-y-auto space-y-2">
                {[...players].sort((a, b) => a.joined - b.joined).map(p => (
                  <div key={p.id} className="flex justify-between items-center bg-slate-600 p-2 rounded anim-rise">
                    <span className="font-semibold">{p.id === "host" ? "👑 " : ""}{p.name}</span>
                    <div className="flex items-center gap-2">
                      {p.id === myId && <span className="text-xs bg-indigo-500 px-2 py-1 rounded">나</span>}
                      {isHost && p.id !== "host" && (
                        <button onClick={() => kickPlayer(p)} className="text-xs bg-red-600 hover:bg-red-500 px-2 py-1 rounded font-bold">
                          내보내기
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>

              {isHost ? (
                <button onClick={startGame} className="w-full bg-indigo-600 hover:bg-indigo-500 font-bold p-4 rounded-lg text-lg transition active:scale-95">
                  대결 시작하기!
                </button>
              ) : (
                <p className="text-slate-400 animate-pulse">방장이 게임을 시작하기를 기다리는 중...</p>
              )}
            </div>
          </div>
        );
      }

      if (view === "RESULT") {
        return page(
          <div className="flex flex-col items-center justify-center min-h-screen p-4">
            {CONFETTI.map((c, i) => (
              <div
                key={i}
                className="confetti"
                style={{ left: `${c.left}%`, background: c.color, animationDuration: `${c.dur}s`, animationDelay: `${c.delay}s` }}
              />
            ))}
            <div className="bg-slate-800 p-6 rounded-xl w-full max-w-lg text-center shadow-lg">
              <h2 className="text-3xl font-bold text-amber-300 mb-6 anim-pop">🏆 최종 결과 🏆</h2>
              <div className="space-y-2 mb-6 max-h-96 overflow-y-auto">
                {sortedPlayers.map((p, idx) => (
                  <div
                    key={p.id}
                    style={{ animationDelay: `${Math.min(idx, 10) * 0.12}s` }}
                    className={`anim-rise rounded flex justify-between items-center ${idx === 0 ? "p-4 text-xl bg-amber-500/20 border border-amber-400" : "p-3"} ${p.id === myId && idx !== 0 ? "bg-indigo-900 border border-indigo-500" : idx !== 0 ? "bg-slate-700" : ""}`}
                  >
                    <span className="font-semibold">
                      {idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx + 1}위`} {p.name}{p.id === myId ? " (나)" : ""}
                    </span>
                    <span className="text-indigo-300 font-bold">{p.score}점</span>
                  </div>
                ))}
              </div>
              {isHost ? (
                <button onClick={restartGame} className="w-full bg-indigo-600 hover:bg-indigo-500 font-bold p-4 rounded-lg text-lg mb-2 transition active:scale-95">
                  같은 방에서 다시 하기
                </button>
              ) : (
                <p className="text-slate-400 mb-2">방장이 다시 시작하면 대기실로 이동합니다.</p>
              )}
              <button onClick={() => location.reload()} className="w-full bg-slate-600 hover:bg-slate-500 font-bold p-3 rounded-lg">
                처음으로
              </button>
            </div>
          </div>
        );
      }

      // GAME
      return page(
        <div className="flex flex-col min-h-screen p-4 max-w-4xl mx-auto">
          {/* 시작 카운트다운 */}
          {countdown > 0 && (
            <div className="fixed inset-0 bg-slate-900/85 z-40 flex items-center justify-center">
              <div key={countdown} className="text-9xl font-extrabold text-indigo-400 anim-count">{countdown}</div>
            </div>
          )}
          {showGo && (
            <div className="fixed inset-0 z-40 flex items-center justify-center pointer-events-none">
              <div className="text-9xl font-extrabold text-emerald-400 anim-go">GO!</div>
            </div>
          )}

          {/* 상단바 */}
          <div className="flex justify-between items-center bg-slate-800 p-4 pr-16 rounded-xl mb-4">
            <div>
              <span className="text-sm text-slate-400">내 점수</span>
              <div className="text-2xl font-bold text-indigo-400"><span key={score} className="anim-bump">{score}</span>점</div>
            </div>
            <div className="text-center">
              <span className="text-sm text-slate-400">남은 시간</span>
              <div className={`text-2xl font-bold ${timeLeft <= 10 ? "text-red-400 animate-pulse" : "text-white"}`}>⏱ {formatTime(timeLeft)}</div>
            </div>
            <div className="text-right">
              <span className="text-sm text-slate-400">콤보</span>
              <div className="text-2xl font-bold text-amber-400">
                <span className={combo >= 5 ? "anim-fire" : ""}>🔥</span> <span key={combo} className="anim-bump">{combo}</span>
              </div>
            </div>
          </div>

          {/* 알림 메시지 */}
          {effectBanner}

          {/* 중앙 문제 & 타자 입력 영역 */}
          <div className="flex-1 bg-slate-800 p-8 rounded-xl flex flex-col justify-center items-center shadow-lg relative mb-4">
            {floaters.map(f => <div key={f.id} className="floater">{f.text}</div>)}
            <div className="mb-8" style={{ position: "relative" }}>
              <div key={targetText} className="text-3xl font-bold text-center tracking-wide text-amber-300 anim-pop">
                {countdown > 0 ? "준비..." : targetText}
              </div>
              {isBlind && (
                <div key={blindKey} className="ink-overlay">
                  <div className="ink-blob" style={{ inset: "8% -4%", borderRadius: "45% 55% 50% 50% / 55% 45% 55% 45%" }} />
                  <div className="ink-blob" style={{ width: 70, height: 70, left: "-6%", top: "-20%", borderRadius: "50%" }} />
                  <div className="ink-blob" style={{ width: 90, height: 90, right: "8%", top: "-35%", borderRadius: "50%" }} />
                  <div className="ink-blob" style={{ width: 50, height: 50, right: "-8%", bottom: "-15%", borderRadius: "50%" }} />
                  <div className="ink-blob" style={{ width: 14, height: 30, left: "30%", bottom: "-28%", borderRadius: "0 0 50% 50%" }} />
                  <div className="ink-blob" style={{ width: 10, height: 22, left: "62%", bottom: "-22%", borderRadius: "0 0 50% 50%" }} />
                </div>
              )}
            </div>
            <input
              ref={inputEl}
              type="text"
              autoComplete="off"
              autoCorrect="off"
              spellCheck={false}
              disabled={countdown > 0}
              className={`w-full max-w-lg p-4 rounded-lg bg-slate-900 text-2xl text-white outline-none border-2 text-center transition-colors ${isWrong ? "border-red-500 anim-shake" : "border-indigo-500"}`}
              placeholder="똑같이 입력하고 Enter!"
              value={input}
              onChange={handleInputChange}
              onKeyDown={handleKeyDown}
              onCompositionStart={handleCompositionStart}
              onCompositionEnd={handleCompositionEnd}
              onPaste={e => e.preventDefault()}
            />
            <p className="text-slate-500 text-sm mt-3">틀린 답으로 Enter를 누르면 콤보가 끊깁니다.</p>
          </div>

          {/* 아이템 바 */}
          <div className="bg-slate-800 p-4 rounded-xl mb-4">
            <span className="text-sm font-bold text-slate-400 mb-2 block">보유 아이템 (10콤보 달성 시 가끔 획득)</span>
            <div className="flex flex-wrap gap-2">
              {items.length === 0 && <span className="text-slate-500 text-sm">아이템이 없습니다.</span>}
              {items.map((it, idx) => (
                <button
                  key={idx}
                  onClick={() => useItem(it, idx)}
                  className="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-3 py-2 rounded text-sm anim-item active:scale-95"
                >
                  {ITEM_LABELS[it]}
                </button>
              ))}
            </div>
          </div>

          {/* 실시간 순위표 */}
          <div className="bg-slate-800 p-4 rounded-xl">
            <h3 className="font-bold text-slate-300 mb-2">실시간 순위</h3>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
              {sortedPlayers.map((p, idx) => (
                <div key={p.id} className={`p-3 rounded flex justify-between items-center gap-1 transition-all ${p.id === myId ? "bg-indigo-900 border border-indigo-500" : "bg-slate-700"}`}>
                  <span className="font-semibold text-sm truncate">{idx === 0 ? "👑" : `${idx + 1}위`} {p.name}</span>
                  <span className="flex items-center gap-1">
                    <span className="text-indigo-300 font-bold">{p.score}</span>
                    {isHost && p.id !== "host" && (
                      <button onClick={() => kickPlayer(p)} title="내보내기" className="text-xs text-red-300 hover:text-red-100 px-1">✕</button>
                    )}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
