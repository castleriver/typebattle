      const createRoom = async () => {
        if (!playerName.trim()) return alert("이름을 입력해주세요!");
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        
        await db.collection("rooms").doc(code).set({
          status: "WAITING",
          mode: mode,
          host: playerName,
          created: new Date()
        });

        await db.collection("rooms").doc(code).collection("players").doc(playerName).set({
          name: playerName,
          score: 0,
          combo: 0,
          effect: null
        });

        setRoomCode(code);
        setIsHost(true);
        setView("ROOM");
      };

      // 방 참가
      const joinRoom = async () => {
        if (!playerName.trim() || !roomCode.trim()) return alert("이름과 방코드를 입력하세요!");
        const doc = await db.collection("rooms").doc(roomCode).get();
        if (!doc.exists) return alert("존재하지 않는 방입니다!");

        await db.collection("rooms").doc(roomCode).collection("players").doc(playerName).set({
          name: playerName,
          score: 0,
          combo: 0,
          effect: null
        });

        setMode(doc.data().mode);
        setIsHost(false);
        setView("ROOM");
      };

      // 대기실 리스너 및 게임 시작 동기화
      useEffect(() => {
        if (!roomCode) return;

        const unsubscribeRoom = db.collection("rooms").doc(roomCode).onSnapshot((doc) => {
          if (doc.exists && doc.data().status === "PLAYING") {
            setView("GAME");
            nextQuestion();
          }
        });

        const unsubscribePlayers = db.collection("rooms").doc(roomCode).collection("players")
          .onSnapshot((snapshot) => {
            const list = snapshot.docs.map(d => d.data());
            setPlayers(list);

            // 나에게 적용된 공격 효과 감지
            const me = list.find(p => p.name === playerName);
            if (me && me.effect) {
              applyEffect(me.effect);
              db.collection("rooms").doc(roomCode).collection("players").doc(playerName).update({ effect: null });
            }
          });

        return () => {
          unsubscribeRoom();
          unsubscribePlayers();
        };
